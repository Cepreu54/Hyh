name: Merge VLESS from working folder

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge all VLESS from working folder
        run: |
          # Создаем временный файл
          > all_vless.txt
          
          # Проходим по всем файлам в папке working
          for file in working/*.txt; do
            if [ -f "$file" ]; then
              grep '^vless://' "$file" >> all_vless.txt || true
            fi
          done
          
          # Сортируем и убираем дубликаты
          sort -u all_vless.txt | grep -v '^$' > merged_vless.txt
          
          # Добавляем временную метку в начало файла
          COUNT=$(grep -c '^vless://' merged_vless.txt)
          echo "# VLESS servers merged: $(date +'%Y-%m-%d %H:%M:%S UTC')" > merged_vless_tmp.txt
          echo "# Total unique servers: $COUNT" >> merged_vless_tmp.txt
          echo "" >> merged_vless_tmp.txt
          cat merged_vless.txt >> merged_vless_tmp.txt
          mv merged_vless_tmp.txt merged_vless.txt
          
          echo "✅ Всего уникальных VLESS серверов: $COUNT"
          echo "COUNT=$COUNT" >> $GITHUB_ENV

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull origin main --rebase
          git add merged_vless.txt
          git commit -m "Auto-merge VLESS [$(date +'%Y-%m-%d %H:%M:%S')] - ${{ env.COUNT }} servers" || echo "No new commits"
          git push origin main
