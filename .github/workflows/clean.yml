name: Merge VLESS Subscriptions

on:
  schedule:
    - cron: '0 * * * *'      # Каждый час
  workflow_dispatch:          # Можно запустить вручную

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Merge all sources
        run: |
          > merged.txt
          
          # 11 файлов из Davai
          for i in {1..11}; do
            curl -s "https://raw.githubusercontent.com/Cepreu54/Davai/main/clean${i}.txt" >> merged.txt
          done
          
          # 3 дополнительных файла
          curl -s "https://raw.githubusercontent.com/Cepreu54/vless-clean/refs/heads/main/clean.txt" >> merged.txt
          curl -s "https://raw.githubusercontent.com/Cepreu54/vless-clean-2/refs/heads/main/clean.txt" >> merged.txt
          curl -s "https://raw.githubusercontent.com/Cepreu54/vless-clean-3/refs/heads/main/clean.txt" >> merged.txt
          
          # Убираем пустые строки и дубликаты
          grep -v '^$' merged.txt | sort -u > merged_clean.txt
          
          # Считаем количество
          COUNT=$(wc -l < merged_clean.txt)
          echo "Всего серверов в объединённой подписке: $COUNT"
          
          # Перемещаем финальный файл
          mv merged_clean.txt merged.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add merged.txt
          git diff --staged --quiet || git commit -m "Auto-merge $(date +'%Y-%m-%d %H:%M:%S')"
          git push
