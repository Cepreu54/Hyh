name: Force update merged_vless.txt

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create merged_vless.txt
        run: |
          # Собираем все VLESS ссылки из папки working
          > merged_vless.txt
          for file in working/*.txt; do
            grep '^vless://' "$file" 2>/dev/null >> merged_vless.txt || true
          done
          
          # Убираем дубликаты
          sort -u merged_vless.txt -o merged_vless.txt
          
          # Добавляем дату в начало
          COUNT=$(grep -c '^vless://' merged_vless.txt)
          echo "# Updated: $(date +'%Y-%m-%d %H:%M:%S UTC')" > temp.txt
          echo "# Total: $COUNT servers" >> temp.txt
          echo "" >> temp.txt
          cat merged_vless.txt >> temp.txt
          mv temp.txt merged_vless.txt

      - name: Force push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add merged_vless.txt
          git commit -m "Force update $(date +'%H:%M:%S')" || true
          git push --force
