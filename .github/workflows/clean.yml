name: Merge VLESS from all sources

on:
  schedule:
    - cron: '*/5 * * * *'        # Каждые 5 минут
  workflow_dispatch:              # Ручной запуск

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Merge all VLESS from 14 sources
        run: |
          # Создаем временный файл
          > all_vless.txt
          
          # 11 файлов из Davai
          for i in {1..11}; do
            curl -s "https://raw.githubusercontent.com/Cepreu54/Hyh/refs/heads/main/working/clean${i}.txt" >> all_vless.txt || true
          done
          
          # 3 дополнительных файла
          curl -s "https://raw.githubusercontent.com/Cepreu54/Hyh/refs/heads/main/working/vless-clean.txt" >> all_vless.txt || true
          curl -s "https://raw.githubusercontent.com/Cepreu54/Hyh/refs/heads/main/working/vless-clean-2.txt" >> all_vless.txt || true
          curl -s "https://raw.githubusercontent.com/Cepreu54/Hyh/refs/heads/main/working/vless-clean-3.txt" >> all_vless.txt || true
          
          # Оставляем только vless:// строки, убираем дубликаты и пустые строки
          grep '^vless://' all_vless.txt | sort -u | grep -v '^$' > merged_vless.txt
          
          # Считаем количество
          COUNT=$(wc -l < merged_vless.txt)
          echo "COUNT=$COUNT" >> $GITHUB_ENV
          echo "✅ Всего уникальных VLESS серверов: $COUNT"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add merged_vless.txt
          git diff --staged --quiet || git commit -m "Auto-merge VLESS (всего ${{ env.COUNT }} серверов)"
          git push
