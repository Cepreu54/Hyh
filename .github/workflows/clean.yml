name: Merge VLESS from working folder

on:
  schedule:
    - cron: '*/5 * * * *'        # Каждые 5 минут
  workflow_dispatch:              # Ручной запуск

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Merge all VLESS from working folder
        run: |
          # Создаем временный файл
          > all_vless.txt
          
          # Проходим по всем файлам в папке working
          for file in working/*.txt; do
            if [ -f "$file" ]; then
              echo "Обрабатываю: $file"
              # Извлекаем строки, начинающиеся с vless://
              grep '^vless://' "$file" >> all_vless.txt || true
            fi
          done
          
          # Оставляем только уникальные vless:// строки
          sort -u all_vless.txt | grep -v '^$' > merged_vless.txt
          
          # Добавляем временную метку (чтобы был виден факт обновления)
          echo "" >> merged_vless.txt
          echo "# Last merged: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> merged_vless.txt
          
          # Считаем количество уникальных серверов
          COUNT=$(grep -c '^vless://' merged_vless.txt)
          echo "COUNT=$COUNT" >> $GITHUB_ENV
          echo "✅ Всего уникальных VLESS серверов в merged_vless.txt: $COUNT"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add merged_vless.txt
          git diff --staged --quiet || git commit -m "Обновление merged_vless.txt (${{ env.COUNT }} серверов) [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push
